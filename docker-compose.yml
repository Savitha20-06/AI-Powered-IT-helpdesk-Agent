services:
  mysql:
    image: mysql:8.4
    container_name: helpdesk-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: helpdesk
      MYSQL_USER: helpdesk
      MYSQL_PASSWORD: helpdesk
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uhelpdesk", "-phelpdesk"]
      interval: 8s
      timeout: 5s
      retries: 20

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: helpdesk-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
      IS_PERSISTENT: "TRUE"

volumes:
  mysql_data:
  chroma_data:
